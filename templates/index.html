<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim File</title>
    <style>
        /* Mengatur dasar ukuran elemen */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Membuat latar belakang halaman abu-abu muda dan meletakkan kotak di tengah */
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* Membuat kotak utama berwarna putih (Card style) */
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        /* Gaya judul */
        h2 {
            text-align: center;
            color: #1a1a1a;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
        }
        
        /* Memberi jarak antar isian */
        .form-group {
            margin-bottom: 18px;
        }
        
        /* Gaya teks di atas kotak isian (Label) */
        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }
        
        /* Memperbesar ukuran kotak isian agar mudah disentuh jari (Touch-friendly) */
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            font-size: 15px;
            background-color: #fafafa;
            transition: border 0.3s;
        }
        
        /* Efek saat kotak isian ditekan */
        input[type="text"]:focus {
            outline: none;
            border-color: #0066ff;
            background-color: #ffffff;
        }
        
        /* Gaya tombol Kirim besar yang mudah ditekan */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: #0066ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s, transform 0.1s;
        }
        
        /* Efek saat tombol ditekan */
        .btn-submit:active {
            transform: scale(0.98);
        }
        
        .btn-submit:hover {
            background-color: #0052cc;
        }
        
        /* Gaya untuk pesan notifikasi hijau */
        .alert-success {
            background-color: #e3fcef;
            color: #006633;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #abf5d1;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>FORM PRINTING INDAH FC</h2>
        
        {% if pesan %}
        <div class="alert-success">
            <strong>Sukses!</strong><br> {{ pesan }}
        </div>
        {% endif %}

        <form method="POST" action="/" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>Nama (Wajib)</label>
                <input type="text" name="nama" placeholder="" required>
            </div>
            
            <div class="form-group">
                <label>No. WhatsApp (Opsional)</label>
                <input type="text" name="no_wa" placeholder="">
            </div>
            
            <div class="form-group">
                <label>Pilih File</label>
                <input type="file" name="file" multiple required>
            </div>
            
            <button type="submit" class="btn-submit">Kirim File</button>
            
        </form> <div style="text-align: center; margin-top: 40px; margin-bottom: 30px;">
            <img src="{{ url_for('static', filename='hiasan2.webp') }}" alt="Gambar Hiasan" style="max-width: 300px; height: auto; border-radius: 15px; opacity: 0.7;">
        </div>
    </div>

</body>
</html>
